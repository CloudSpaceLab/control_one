name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-2025-vs2026, macos-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Format check
        shell: bash
        run: gofmt -l . && test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./...

      - name: Setup Node (frontend)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm ci --prefix ui

      - name: Frontend lint
        if: matrix.os == 'ubuntu-latest'
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
        run: npm run lint --prefix ui

      - name: Frontend tests
        if: matrix.os == 'ubuntu-latest'
        run: npm run test --prefix ui

      - name: Frontend production build
        if: matrix.os == 'ubuntu-latest'
        run: npm run build --prefix ui

      - name: Raw-log deployment contract
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          grep -Fq 'CONTROL_ONE_LOG_DUMPS_DIR: "/var/lib/control-one/log-dumps"' deploy/docker-compose.yaml
          grep -Fq './log-dumps:/var/lib/control-one/log-dumps' deploy/docker-compose.yaml
          grep -Fq "'\$DEPLOY_DIR/log-dumps'" .github/workflows/deploy.yml
          grep -Fq "chown 65532:65532 '\$DEPLOY_DIR/threat-intel' '\$DEPLOY_DIR/analytics' '\$DEPLOY_DIR/log-dumps'" .github/workflows/deploy.yml
          grep -Fq 'client_max_body_size 4m;' deploy/nginx/control-one.host.conf
          grep -Fq 'client_max_body_size 4m;' deploy/nginx/edge.conf

      - name: Offline IP intelligence deployment contract
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          grep -Fq 'IP_INTEL_CITY_MMDB: "/var/lib/control-one/ip-intel/dbip-city-lite.mmdb"' deploy/docker-compose.yaml
          grep -Fq 'IP_INTEL_ASN_MMDB: "/var/lib/control-one/ip-intel/dbip-asn-lite.mmdb"' deploy/docker-compose.yaml
          grep -Fq './ip-intel:/var/lib/control-one/ip-intel:ro' deploy/docker-compose.yaml
          ! grep -Fq 'akyriako78/ipquery' deploy/docker-compose.yaml
          grep -Fq 'docker rm -f deploy-ipq-1' .github/workflows/deploy.yml
          grep -Fq "chown 0:65532 '\$DEPLOY_DIR/ip-intel'" .github/workflows/deploy.yml
          bash -n scripts/update_dbip_lite.sh
          grep -Fq "cron: '17 3 5 * *'" .github/workflows/refresh-ip-intel.yml
          grep -Fq 'docker compose up -d --force-recreate --no-deps controlplane' .github/workflows/refresh-ip-intel.yml
          grep -Fq 'offline DB-IP geo/ASN provider loaded' .github/workflows/deploy.yml
          grep -Fq 'offline DB-IP geo/ASN provider loaded' .github/workflows/refresh-ip-intel.yml

      - name: Storage integration tests
        if: matrix.os == 'ubuntu-latest'
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: >-
          go test -v ./controlplane/internal/storage
          -run 'Test(JobLifecycleWithPostgres|LogDump)'
          -count=1

      - name: Raw-log agent integration tests
        if: matrix.os == 'ubuntu-latest'
        run: go test -v ./cmd/nodeagent -run 'Test.*LogDump' -count=1

      - name: Migration integration test
        if: matrix.os == 'ubuntu-latest'
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -v ./controlplane/internal/migrate -run TestMigrationsUpAndDown -count=1

      - name: Build agent
        run: go build -o ${{ runner.temp }}/nodeagent ./cmd/nodeagent

      - name: Build control plane
        run: go build -o ${{ runner.temp }}/controlplane ./controlplane/cmd/controlplane

      - name: Generate wizard bundle
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/wizard/setup_control_one.sh --output ./build/wizard --non-interactive --no-certs

      - name: Upload wizard bundle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: control-one-wizard-${{ github.sha }}
          path: build/wizard
          retention-days: 7

  goreleaser:
    needs: lint-test-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
